# ============================ Workspace ============================

Workspace:
  name: JSONLENS-PROJECT
  repositories:
    adminJsonLens:
      path: ./adminJsonLens
      role: backend
      stack: [Node.js, Express, JavaScript]

# ============================ Management ===========================

Management:
  trello:
    usage: Gestion del trabajo por fases con checklists.
  notion:
    usage: Documentacion, decisiones tecnicas y base de conocimiento.
  github:
    usage: Control de versiones y trabajo por ramas.

# ============================ Git Flow =============================

Git_Flow:
  applies_to: adminJsonLens

  branches:
    main:
      role: produccion
      rules:
        - Solo codigo estable.
        - No trabajar directo en main.

    dev:
      role: integracion
      rules:
        - Las features nacen desde dev.
        - Los bugfix normales nacen desde dev.

    feature:
      pattern: feature/${NAME}
      target: dev

    bugfix:
      pattern: bugfix/${NAME}
      target: dev

    hotfix:
      pattern: hotfix/${NAME}
      source: main
      targets: [main, dev]

  commit_convention:
    format: "type: descripcion corta"
    types: [feat, fix, docs, refactor, chore, test]

# ============================ Project Map ==========================

Project_Map:
  adminJsonLens:
    role: backend
    stack: Node.js, Express, JavaScript
    status: MVP en desarrollo

    modules:
      - core
      - json-processing

    core_actions:
      - about
      - health

    json_processing_actions:
      - validate
      - format
      - analyze
      - compare

# ============================ NPM Scripts ==========================

Npm_Scripts:
  adminJsonLens:
    development:
      dev: node src/server.js
      start: node src/server.js

# ========================= HTTP Status =============================

HTTP_Status:
  success_2xx:
    - code: 200
      name: OK
      use: Request exitoso con respuesta
    - code: 201
      name: Created
      use: Recurso creado exitosamente
    - code: 204
      name: No Content
      use: Operacion exitosa sin body

  redirection_3xx:
    - code: 301
      name: Moved Permanently
      use: URL movida permanentemente
    - code: 302
      name: Found
      use: Redireccion temporal
    - code: 304
      name: Not Modified
      use: Recurso no ha cambiado

  client_error_4xx:
    - code: 400
      name: Bad Request
      use: Datos mal formados o falta un campo
    - code: 401
      name: Unauthorized
      use: Autenticacion requerida
    - code: 403
      name: Forbidden
      use: Acceso denegado
    - code: 404
      name: Not Found
      use: Ruta o recurso no existe
    - code: 422
      name: Unprocessable Entity
      use: Datos validos pero no cumplen contrato

  server_error_5xx:
    - code: 500
      name: Internal Server Error
      use: Error interno del backend
    - code: 502
      name: Bad Gateway
      use: Servidor no disponible
    - code: 503
      name: Service Unavailable
      use: Servicio temporalmente no disponible

  mvp_reference:
    uses_now: [200, 400, 404, 500]
    later_possible: [201, 401, 403, 422]

# ======================= VSCode Performance ========================

VSCode_Performance:
  objective:
    - Reducir consumo de CPU, RAM y disco en VS Code.
    - Evitar lentitud cuando hay muchas extensiones activas.

  settings_scope:
    workspace_root:
      file: ./.vscode/settings.json
      note: Aplica a todas las carpetas si abres la raiz del workspace.
    per_repository:
      file: ./.vscode/settings.json
      note: Crear este archivo en cada repo si se abre por separado.

  recommended_settings:
    files_watcher_exclude:
      - "**/.git/objects/**"
      - "**/.git/subtree-cache/**"
      - "**/node_modules/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/coverage/**"
      - "**/.next/**"
      - "**/.cache/**"
      - "**/.turbo/**"
      - "**/.vite/**"
      - "**/.vercel/**"
    search_exclude:
      - "**/node_modules"
      - "**/dist"
      - "**/build"
      - "**/coverage"
      - "**/.next"
      - "**/.cache"
      - "**/.turbo"
      - "**/.vite"
    editor:
      eslint_run: onSave
      format_on_type: false
      npm_auto_detect: off
      typescript_automatic_type_acquisition: false

  extension_bisect:
    where:
      - Abrir Command Palette: Ctrl+Shift+P
      - Ejecutar: Extensions: Start Extension Bisect
    flow:
      - Probar si la lentitud sigue.
      - Responder "Yes" si sigue lento.
      - Responder "No" si mejora.
      - Repetir hasta identificar la extension conflictiva.

  ai_and_tools_policy:
    ai_extensions:
      - Usar una sola extension de IA activa para trabajo diario.
    chat_tools_keep_enabled:
      - read
      - search
      - editFiles
      - execute
    chat_tools_disable_by_default:
      - browser
      - openBrowserPage
      - web
      - todo
      - createJupyterNotebook
      - editNotebook
      - GitKraken
      - Database Client
      - Prisma

  validation(ctrl+shift+p):
    - Ejecutar: Developer: Reload Window
    - Ejecutar: Help: Open Process Explorer
    - Verificar durante 5-10 minutos que Extension Host se mantiene estable.
