# ============================ Workspace ============================

Workspace:
  name: JSONLENS-PROJECT
  repositories:
    adminJsonLens:
      path: ./adminJsonLens
      role: backend
      stack: [Node.js, Express, JavaScript]

# ============================ Management ===========================

Management:
  trello:
    usage: Gestion del trabajo por fases con checklists.
  notion:
    usage: Documentacion, decisiones tecnicas y base de conocimiento.
  github:
    usage: Control de versiones y trabajo por ramas.


# ============================ 5 PASOS INICIALES ============================

Initial_Steps:
  - "1. Planificacion: Define objetivos, funcionalidades y diseno del proyecto."
  - "2. Configuracion: Configura Git, estructura de carpetas e instala dependencias. Revisar NPM Scripts."
  - "3. Desarrollo: Desarrolla features siguiendo el flujo feature -> dev -> main."
  - "4. Pruebas: Pruebas unitarias y revision de codigo mediante pull requests."
  - "5. Deploy: Despliega y recopila feedback de usuarios."

# ============================ Git Flow =============================

Git-Flow:
  applies_to: adminJsonLens

  branches:
    main:
      role: produccion
      rules:
        - Solo codigo estable.
        - No trabajar directo en main.

    dev:
      role: integracion
      rules:
        - Las features nacen desde dev.
        - Los bugfix normales nacen desde dev.

    feature:
      pattern: feature/${NAME}
      target: dev

    bugfix:
      pattern: bugfix/${NAME}
      target: dev

    hotfix:
      pattern: hotfix/${NAME}
      source: main
      targets: [main, dev]

  commit_convention:
    format: "type: descripcion corta"
    types: [feat, fix, docs, refactor, chore, test]

# ============================ Project Map ==========================

Project_Map:
  adminJsonLens:
    role: backend
    stack: Node.js, Express, JavaScript
    status: MVP en desarrollo

    modules:
      - core
      - json-processing

    core_actions:
      - about
      - health

    json_processing_actions:
      - validate
      - format
      - analyze
      - compare

# ============================ NPM Scripts ==========================

Npm_Scripts:

  adminJsonLens:

    development:
      dev: node src/server.js
      start: node src/server.js

    security:
      ignore_scripts: npm install --ignore-scripts
      ci_ignore_scripts: npm ci --ignore-scripts
      deps_audit_high: npm audit --audit-level=high

    dependencies:
      deps_audit: npm audit
      deps_outdated: npm outdated

## ========================= HTTP Status ==========================

## 2xx - Éxito

| Código | Significado | Uso                           |
| ------ | ----------- | ----------------------------- |
| `200`  | OK          | Request exitoso con respuesta |
| `201`  | Created     | Recurso creado exitosamente   |  
| `204`  | No Content  | Operación exitosa sin body    |

## 3xx - Redirección

| Código | Significado       | Uso                        |
| ------ | ----------------- | -------------------------- |
| `301`  | Moved Permanently | URL movida permanentemente |
| `302`  | Found             | Redirección temporal       |
| `304`  | Not Modified      | Recurso no ha cambiado     |

## 4xx - Error del Cliente

| Código | Significado          | Uso                                    |
| ------ | -------------------- | -------------------------------------- |
| `400`  | Bad Request          | Datos mal formados o falta un campo    |
| `401`  | Unauthorized         | Autenticación requerida                |
| `403`  | Forbidden            | Acceso denegado (sin permisos)         |
| `404`  | Not Found            | Ruta o recurso no existe               |
| `422`  | Unprocessable Entity | Datos válidos pero no cumplen contrato |

## 5xx - Error del Servidor

| Código | Significado           | Uso                                  |
| ------ | --------------------- | ------------------------------------ |
| `500`  | Internal Server Error | Error interno del backend            |
| `502`  | Bad Gateway           | Servidor no disponible               |
| `503`  | Service Unavailable   | Servicio temporalmente no disponible |

## Referencia Rápida - MVP

- **MVP actual usa**: `200`, `400`, `404`, `500`
- **Futuro con auth**: `201`, `401`, `403`, `422`


